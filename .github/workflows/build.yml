name: Release extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.created == true && github.event.deleted == false
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tag matches package version
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' must match package.json version ('$expectedTag')."
          }
      - name: Run tests
        run: node --test
      - name: Build ZIP
        id: build
        run: npm run build:ci
      - name: Create GitHub release with ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_PATH: ${{ steps.build.outputs.archive_path }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:ARCHIVE_PATH" --verify-tag --title "$env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create GitHub release with ZIP.'
          }
