
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'">
    <title>Requests Interceptor</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="wrap">
      <h3>Requests Interceptor</h3>
      <label class="switch-row">
        <span>Global rules</span>
        <span class="switch">
          <input type="checkbox" id="globalToggle">
          <span class="slider"></span>
        </span>
      </label>
      <button class="btn" id="openOptions" type="button">Open Admin Panel</button>
      <hr>
      <div class="section-title">Active on this page</div>
      <ul id="appliedRules" class="rules"></ul>
      <footer id="appVersion" class="app-version" aria-label="App version"></footer>
    </div>
    <script src="../shared/version.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
